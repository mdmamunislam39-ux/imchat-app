name: chat_messenger
description: Flutter Chat Messenger
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.6+7

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0 <4.0.0" # Minimum required Flutter SDK v3.22.0 or greater

# Dependencies:
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`.
# To see which dependencies have newer
# versions available on pub.dev, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
    
  # CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  # Firebase dependencies
  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.0.2
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1
  firebase_database: ^12.0.1
  cloud_functions: ^6.0.1
  google_mobile_ads: ^5.1.0

  # App dependencies
  get: ^4.6.6
  flutter_iconly:
    path: packages/flutter_iconly
  google_fonts: ^8.1.0
  flutter_svg: ^2.1.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.1
  video_thumbnail: any
  path_provider: ^2.1.4
  path: ^1.9.1
  timeago: ^3.7.0
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  # camera: ^0.11.0+2
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  permission_handler: ^12.0.1
  flutter_spinkit: ^5.2.1
  http: ^1.2.2
  easy_rich_text: ^2.2.0
  shimmer: ^3.0.0
  audioplayers: ^6.1.0
  # assets_audio_player: ^3.1.1
  # wechat_assets_picker: ^9.2.1
  emoji_picker_flutter: ^4.3.0
  giphy_get: ^3.5.6
  file_picker: ^8.1.4
  mime: ^2.0.0
  chewie: ^1.8.4
  uuid: ^4.3.0
  marquee: ^2.3.0
  geolocator: ^14.0.1
  record: ^6.0.0
  encrypt: ^5.0.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.5
  agora_rtc_engine: ^6.5.3
  flutter_ringtone_player: any
  video_editor: ^3.0.0
  fraction: ^5.0.3
  story_view: ^0.16.5
  async: ^2.13.0
  rxdart: ^0.28.0
  country_code_picker: ^3.0.0
  lottie: ^3.1.2
  # contacts_service: ^0.6.3
  get_storage: ^2.1.1
  package_info_plus: ^9.0.0
  flutter_overlay_window: any
  # dash_bubble: ^2.0.0
  agora_token_generator: ^0.0.1
  dotted_border: ^3.0.1
  wechat_assets_picker: ^9.4.0
  flutter_contacts_service: ^0.2.0
  x_overlay: ^1.0.0
  # BLoC for Audio Rooms v2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_svga: ^0.0.6
  wakelock_plus: ^1.4.0
  flutter_foreground_task: ^9.2.0
  flutter_background_service: ^5.1.0
