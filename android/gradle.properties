# JVM heap size configured safely for large project compilations
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
kotlin.daemon.jvmargs=-Xmx1536M

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Networking tweaks
systemProp.https.protocols=TLSv1.2
systemProp.http.keepAlive=true

# Gradle performance tweaks - avoid memory exhaustion from 12 parallel workers
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
kotlin.incremental=true

# Increase network timeouts for slow connections
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000

# CMake and NDK configuration for Agora RTC Engine
android.native.buildOutput=verbose



